name: 우간다 안전공지 크롤러

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 4 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 패키지 설치
        run: pip install requests beautifulsoup4 pypdf python-docx
      - name: 크롤러 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python crawl.py
      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "🔄 우간다 안전공지 업데이트 $(date +'%Y-%m-%d %H:%M KST')"
          git push
