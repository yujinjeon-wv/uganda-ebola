name: 우간다 안전공지 크롤러

on:
  schedule:
    # 매일 오전 8시 / 오후 2시 / 오후 9시 (KST = UTC+9)
    - cron: '0 23 * * *'   # KST 08:00
    - cron: '0 5 * * *'    # KST 14:00
    - cron: '0 12 * * *'   # KST 21:00
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: write            # data/posts.json 커밋 권한

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install requests beautifulsoup4 pypdf

      - name: 크롤러 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python crawl.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "🔄 우간다 안전공지 업데이트 $(date +'%Y-%m-%d %H:%M KST')"
          git push
